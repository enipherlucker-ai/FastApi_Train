name: fastapi-train

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/enipherlucker-ai/fastapi_train-api:${IMAGE_TAG}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      pg_database:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  pg_database:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_SETTINGS__USER}
      POSTGRES_PASSWORD: ${POSTGRES_SETTINGS__PASSWORD}
      POSTGRES_DB: ${POSTGRES_SETTINGS__DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  bot:
    image: ghcr.io/enipherlucker-ai/fastapi_train-bot:${IMAGE_TAG:?укажи IMAGE_TAG}
    environment:
      TELEGRAM_SETTINGS__TOKEN: ${TELEGRAM_SETTINGS__TOKEN:?добавь TELEGRAM_SETTINGS__TOKEN в .env}
      TELEGRAM_SETTINGS__ALLOWED_USER_IDS: ${TELEGRAM_SETTINGS__ALLOWED_USER_IDS:-[]}
      RECEIPT_API_SETTINGS__URL: http://api:8000
    depends_on:
      - api
    stop_signal: SIGINT
    restart: unless-stopped
    logging: *logging

  web:
    image: ghcr.io/enipherlucker-ai/fastapi_train-web:${IMAGE_TAG:?укажи IMAGE_TAG}
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:? добавить SITE_DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

volumes:
  pg_data:
  caddy_data:
  caddy_config:


